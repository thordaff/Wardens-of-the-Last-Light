name: Godot CI
on:
  pull_request:
    # labeled: label "qa-lolos" dari QA memicu auto-merge.
    types: [opened, synchronize, reopened, ready_for_review, labeled]
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Lint GDScript
        run: |
          pip install "gdtoolkit==4.*"
          gdlint scripts tests
          gdformat --check scripts tests
      - name: Download Godot 4.5
        run: |
          curl -sSL -o godot.zip https://github.com/godotengine/godot/releases/download/4.5-stable/Godot_v4.5-stable_linux.x86_64.zip
          unzip -q godot.zip && mv Godot_v4.5-stable_linux.x86_64 godot
      - name: Import project
        run: ./godot --headless --import 2>&1 | tee import.log; ! grep -E "SCRIPT ERROR|Parse Error|ERROR:" import.log
      - name: Cek file .import sama dengan hasil Godot
        run: git diff --exit-code -- '*.import'
      - name: Tes
        run: |
          ./godot --headless -s res://tests/smoke_test.gd
          ./godot --headless -s res://tests/test_battle.gd
          ./godot --headless -s res://tests/test_town.gd
          ./godot --headless -s res://tests/test_encounters.gd
      - name: Jalankan main scene 120 frame
        run: ./godot --headless --quit-after 120 2>&1 | tee run.log; ! grep -E "SCRIPT ERROR|ERROR:" run.log
      - name: Jalankan scene battle 300 frame
        run: ./godot --headless --quit-after 300 res://scenes/battle/battle.tscn 2>&1 | tee battle.log; ! grep -E "SCRIPT ERROR|ERROR:" battle.log
      - name: Jalankan kota graybox 300 frame
        run: ./godot --headless --quit-after 300 res://scenes/world/town_graybox.tscn 2>&1 | tee town.log; ! grep -E "SCRIPT ERROR|ERROR:" town.log

  # Auto-merge ke main bila CI hijau, PR bukan draft, dan QA sudah memberi label
  # "qa-lolos". Merge commit (bukan squash) supaya PR bertumpuk tetap bersih.
  auto-merge:
    needs: check
    if: >-
      github.event_name == 'pull_request' &&
      github.event.pull_request.base.ref == 'main' &&
      !github.event.pull_request.draft &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      contains(github.event.pull_request.labels.*.name, 'qa-lolos')
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - name: Merge ke main
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR: ${{ github.event.pull_request.number }}
          SHA: ${{ github.event.pull_request.head.sha }}
        run: gh pr merge "$PR" --repo "$GITHUB_REPOSITORY" --merge --match-head-commit "$SHA"
